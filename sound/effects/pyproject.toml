# The environment Stable Audio Open runs in: diffusers and a CUDA PyTorch.
# `worker.py` runs here as a process of its own; uv builds this on first use.
[project]
name = "model-harness-effects"
version = "0.1.0"
description = "Stable Audio Open 1.0, as a worker process of model-harness sound chats"
requires-python = ">=3.11,<3.13"
dependencies = [
    "diffusers>=0.37,<0.44",
    "transformers>=4.50,<5",
    "accelerate>=1.0",
    "sentencepiece>=0.2",
    # Its scheduler, CosineDPMSolverMultistep, needs it.
    "torchsde>=0.2.6",
    "torch==2.10.0",
    "torchaudio==2.10.0",
    "soundfile>=0.13",
]

[tool.uv]
package = false
environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
